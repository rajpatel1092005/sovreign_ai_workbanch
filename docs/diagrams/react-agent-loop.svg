        <rect x="520" y="310" width="32" height="10" rx="2" fill="none" stroke="#bfc0c0" stroke-width="0.7" stroke-opacity="0.4"/>
        <text x="536" y="318" fill="#bfc0c0" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL 4</text>
        <text x="588" y="328" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">generate_report</text>
        <text x="588" y="344" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDF · DOCX · XLSX</text>

        <!-- Node 4: Observation & Step Evaluator -->
        <rect x="744" y="172" width="128" height="76" rx="6" fill="#2d3142"/>
        <rect x="744" y="172" width="128" height="76" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.06"/>
        <rect x="752" y="180" width="34" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8" stroke-opacity="0.4"/>
