        <text x="588" y="98" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">search_kb</text>
        <text x="588" y="114" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Vector + Lexical RAG</text>

        <!-- Tool Node B: read_uploaded_document -->
        <rect x="512" y="144" width="152" height="56" rx="5" fill="#2d3142"/>
