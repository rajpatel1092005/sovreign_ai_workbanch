        <rect x="512" y="226" width="152" height="56" rx="5" fill="#2d3142"/>
        <rect x="512" y="226" width="152" height="56" rx="5" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.9" fill-opacity="0.04"/>
        <rect x="520" y="232" width="32" height="10" rx="2" fill="none" stroke="#bfc0c0" stroke-width="0.7" stroke-opacity="0.4"/>
