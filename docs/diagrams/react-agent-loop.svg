        <text x="233" y="189" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">INIT</text>
        <text x="272" y="208" fill="#f5f5f5" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loop Context</text>
        <text x="272" y="224" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">agent.py</text>
        <text x="272" y="238" fill="#949eb2" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">Tool Schemas Bind</text>

        <!-- Node 3: Focal Reasoner (qwen3.5:4b) -->
        <rect x="388" y="172" width="104" height="76" rx="6" fill="#2d3142"/>
        <rect x="388" y="172" width="104" height="76" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1.3" fill-opacity="0.08"/>
        <rect x="396" y="180" width="36" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="414" y="189" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">REASON</text>
        <text x="440" y="208" fill="#f5f5f5" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">qwen3.5:4b</text>
