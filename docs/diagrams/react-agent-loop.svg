        <text x="808" y="208" fill="#f5f5f5" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Step Evaluator</text>
        <text x="808" y="224" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Timeline Tracker</text>
        <text x="808" y="238" fill="#949eb2" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">Next Action or Stop?</text>

        <!-- Node 5: Deliverable / UI Timeline Output -->
