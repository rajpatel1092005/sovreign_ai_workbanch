        <text x="588" y="250" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">execute_code</text>
        <text x="588" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Python Isolated Sandbox</text>

