        <text x="588" y="168" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">read_document</text>
        <text x="588" y="184" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Local Text / PDF Ingest</text>

