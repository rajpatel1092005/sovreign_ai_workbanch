        <rect x="916" y="172" width="60" height="76" rx="6" fill="#739fdf" stroke="#739fdf" stroke-width="1" fill-opacity="0.08"/>
        <rect x="922" y="180" width="28" height="12" rx="2" fill="none" stroke="#739fdf" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="936" y="189" fill="#739fdf" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">OUT</text>
        <text x="946" y="210" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Artifact</text>
        <text x="946" y="226" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDF/UI</text>

        <!-- Summary Metric Cards below -->
        <rect x="32" y="440" width="290" height="64" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.1"/>
        <text x="48" y="460" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.1em">AUTONOMOUS STEPPING</text>
        <text x="48" y="478" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Zero Hardcoded Scripting</text>
        <text x="48" y="494" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">The LLM dynamically decides tools and loop limits</text>

        <rect x="354" y="440" width="290" height="64" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.1"/>
        <text x="370" y="460" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', monospace" letter-spacing="0.1em">LOCAL AIR-GAP SAFETY</text>
        <text x="370" y="478" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif">100% On-Premise Execution</text>
        <text x="370" y="494" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">All tools run in local isolated environments</text>

        <rect x="676" y="440" width="290" height="64" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.1"/>
