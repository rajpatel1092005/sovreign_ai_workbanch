<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-loop-title agent-loop-desc" id="react-agent-loop-root">
        <title id="agent-loop-title">Autonomous Stage-4 ReAct Tool Execution Loop</title>
        <desc id="agent-loop-desc">Flowchart showing the iterative ReAct agent loop from user goal input, local LLM reasoning, dynamic tool selection, subprocess execution, observation injection, and final deliverable compilation.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #react-agent-loop-root { --color-paper:   #2d3142;
      --color-paper-2: #393e53;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --color-link:    #739fdf;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #react-agent-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #react-agent-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#react-agent-loop-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="react-agent-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/>
          </pattern>
          <marker id="react-agent-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="react-agent-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="react-agent-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <!-- Base Background -->
        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#react-agent-loop-dots)" opacity="0.6"/>

        <!-- Phase Zone: Tool Execution Sandbox -->
        <rect x="390" y="56" width="300" height="364" rx="8"
              fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="460" y="48" width="160" height="16" rx="3" fill="#2d3142"/>
        <text x="540" y="60" fill="#949eb2" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOCAL TOOL DISPATCH ENGINE</text>

        <!-- Connectors / Lines (Drawn behind nodes) -->
        <!-- User Input -> ReAct Loop Initializer -->
        <line x1="160" y1="210" x2="208" y2="210" stroke="#739fdf" stroke-width="1.3" marker-end="url(#react-agent-loop-arrow-link)"/>

        <!-- Initializer -> qwen3.5 Reasoner -->
        <line x1="336" y1="210" x2="388" y2="210" stroke="#f08a59" stroke-width="1.4" marker-end="url(#react-agent-loop-arrow-accent)"/>

        <!-- Reasoner to Tool 1 (search_knowledge_base) -->
        <path d="M 470,172 V 110 Q 470,102 478,102 H 512" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#react-agent-loop-arrow)"/>

        <!-- Reasoner to Tool 2 (read_uploaded_document) -->
        <path d="M 490,172 V 172 H 512" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#react-agent-loop-arrow)"/>

        <!-- Reasoner to Tool 3 (execute_python_code) -->
        <path d="M 490,248 V 254 H 512" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#react-agent-loop-arrow)"/>

        <!-- Reasoner to Tool 4 (generate_report) -->
        <path d="M 470,248 V 324 Q 470,332 478,332 H 512" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#react-agent-loop-arrow)"/>

        <!-- Tools to Observation Collector -->
        <path d="M 664,102 H 696 Q 704,102 704,110 V 210" fill="none" stroke="#bfc0c0" stroke-width="1.1"/>
        <path d="M 664,172 H 704" fill="none" stroke="#bfc0c0" stroke-width="1.1"/>
        <path d="M 664,254 H 704" fill="none" stroke="#bfc0c0" stroke-width="1.1"/>
        <path d="M 664,332 H 696 Q 704,332 704,324 V 210" fill="none" stroke="#bfc0c0" stroke-width="1.1"/>
        <line x1="704" y1="210" x2="744" y2="210" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#react-agent-loop-arrow)"/>

        <!-- Observation Collector -> Feedback Loop back to Reasoner -->
        <path d="M 808,172 V 120 Q 808,80 760,80 H 320 Q 272,80 272,120 V 172"
              fill="none" stroke="#f08a59" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#react-agent-loop-arrow-accent)"/>

        <!-- Observation Collector -> Final Deliverable Synthesis -->
        <line x1="872" y1="210" x2="916" y2="210" stroke="#739fdf" stroke-width="1.3" marker-end="url(#react-agent-loop-arrow-link)"/>

        <!-- Masked Arrow Labels -->
        <rect x="164" y="196" width="40" height="14" rx="2" fill="#2d3142"/>
        <text x="184" y="206" fill="#739fdf" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">GOAL</text>

        <rect x="340" y="196" width="44" height="14" rx="2" fill="#2d3142"/>
        <text x="362" y="206" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">PROMPT</text>

        <rect x="480" y="72" width="112" height="14" rx="2" fill="#2d3142"/>
        <text x="536" y="82" fill="#f08a59" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">OBSERVATION FEEDBACK LOOP</text>

        <rect x="874" y="196" width="38" height="14" rx="2" fill="#2d3142"/>
        <text x="893" y="206" fill="#739fdf" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">FINAL</text>

        <!-- Node 1: User Request / Intent -->
        <rect x="32" y="172" width="128" height="76" rx="6" fill="#2d3142"/>
        <rect x="32" y="172" width="128" height="76" rx="6" fill="#739fdf" stroke="#739fdf" stroke-width="1" fill-opacity="0.06"/>
